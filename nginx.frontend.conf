# nginx.frontend.conf
server {
    listen 80;
    server_name localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # Assets React
    location ~* \.(js|css|png|jpg|jpeg|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Le service worker doit toujours vérifier s'il a été mis à jour.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA React
    location / {
        try_files $uri $uri/ /index.html;
    }
}